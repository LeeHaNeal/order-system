services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_system
    ports:
      - "5432:5432"
    volumes:
      - order_system_pgdata:/var/lib/postgresql/data

volumes:
  order_system_pgdata:
